<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    /* Everything is sized in rem, and rem follows the screen width, so the
       layout is the same shape on a 1080p TV, a 4K one or a laptop. */
    html { font-size: calc(100vw / 120) }
    :root {
      --bg: #f6efe6; --panel: #fffdf9; --panel2: #f4ece0; --line: #eadfce;
      --text: #2b2620; --mut: #8a7f70;
      --red: #e5484d; --amber: #e8890c; --green: #2fb67c; --blue: #3b82e6; --pink: #ec4e9a; --purple: #7B6EAB;
      --font: "Nunito", "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html, body { height: 100% }
    body { background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; cursor: none }
    .full-center { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: var(--mut); text-align: center }
    .error-state h2 { font-size: 2rem; margin-bottom: .6rem }
    .error-state p { color: var(--mut); font-size: 1.1rem }

    .screen { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; gap: 1.1rem; padding: 1.4rem 1.8rem 1rem }

    /* Header */
    .hdr { display: flex; align-items: center; gap: 1.2rem }
    .hdr-co { font-size: 1.9rem; font-weight: 800; letter-spacing: .02em }
    .hdr-co b { color: var(--pink) }
    .hdr-stale { font-size: .9rem; font-weight: 700; color: var(--amber) }
    .hdr-right { margin-left: auto; display: flex; align-items: center; gap: 1.4rem }
    .hdr-date { font-size: 1.5rem; color: var(--mut) }
    .hdr-clock { font-size: 4rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1 }

    .main { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.2rem; min-height: 0 }
    .col { display: flex; flex-direction: column; gap: 1.2rem; min-height: 0 }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 1.8rem; padding: 1.3rem 1.6rem; box-shadow: 0 .4rem 1.5rem #6b4a2512; min-height: 0; overflow: hidden; display: flex; flex-direction: column }
    .grow { flex: 1 }
    .panel h2 { font-size: .95rem; letter-spacing: .18em; text-transform: uppercase; color: var(--mut); font-weight: 800; margin-bottom: .8rem; display: flex; align-items: center; gap: .6rem }
    .panel h2 .n { margin-left: auto; letter-spacing: 0; font-size: 1rem }
    .empty { color: var(--mut); font-size: 1.3rem; padding: .6rem 0 }

    /* Deadlines */
    .dl { display: flex; flex-direction: column; gap: .55rem; min-height: 0; overflow: hidden }
    .grp { font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--mut); margin: .35rem 0 -.1rem }
    .d { display: grid; grid-template-columns: 11rem 1fr auto; align-items: center; gap: 1.2rem; border-radius: 1.2rem; padding: .6rem 1.2rem; background: var(--panel2); border-left: .6rem solid var(--blue) }
    .d .when { font-size: 2rem; font-weight: 800; line-height: 1 }
    .d .when small { display: block; font-size: .9rem; font-weight: 700; color: var(--mut); margin-top: .25rem; letter-spacing: .03em }
    .d .what { font-size: 1.7rem; font-weight: 700; line-height: 1.15 }
    .d .who { color: var(--mut); font-size: 1.1rem; margin-top: .15rem }
    .d.over { border-color: var(--red); background: #ffe6e4 } .d.over .when { color: var(--red) }
    .d.today { border-color: var(--amber); background: #fff0d4 } .d.today .when { color: var(--amber) }
    .d.later { border-color: #b9c9e6 } .d.later .when { color: #6c7a96 }
    .av { width: 2.7rem; height: 2.7rem; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; color: #fff }
    .more { color: var(--mut); font-size: 1.1rem; font-weight: 700; padding: .2rem .4rem }

    /* Week */
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: .5rem; flex: 1; min-height: 0 }
    .wd { background: var(--panel2); border-radius: 1rem; padding: .55rem .6rem; min-width: 0; overflow: hidden }
    .wd.we { opacity: .6 }
    .wd.t { outline: .15rem solid var(--amber); background: #fff7e6 }
    .wd b { display: block; font-size: .85rem; letter-spacing: .1em; color: var(--mut); margin-bottom: .1rem }
    .wd .dt { font-size: 1.5rem; font-weight: 800; margin-bottom: .3rem }
    .wd .hol { font-size: .8rem; color: var(--leave, #0891b2); font-weight: 700; margin-bottom: .2rem }
    .ev { border-radius: .5rem; padding: .15rem .45rem; margin-bottom: .25rem; font-size: .85rem; font-weight: 700; color: #fff; line-height: 1.2; overflow: hidden; overflow-wrap: anywhere }
    .ev.dl { box-shadow: inset 0 0 0 .12rem #ffffffaa }
    .wd .more { font-size: .8rem; padding: 0 }

    /* Retainers */
    .ret { display: flex; flex-direction: column; gap: .7rem; overflow: hidden }
    .ret-row .top { display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700 }
    .ret-row .top span:last-child { color: var(--mut) }
    .bar { height: .7rem; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: .3rem }
    .bar i { display: block; height: 100%; border-radius: 99px }

    /* Footer */
    .foot { display: flex; align-items: center; gap: 1.6rem; color: var(--mut); font-size: 1.15rem; border-top: 1px solid var(--line); padding-top: .6rem; min-height: 2.2rem }
    .foot b { color: var(--text) }
    .foot .live { margin-left: auto }
    .pill { display: inline-flex; align-items: baseline; gap: .4rem; padding: .25rem 1rem; border-radius: 99px; color: #fff; font-weight: 700 }
    .pill.ds { background: #c0392b } .pill.yt { background: var(--purple) }
    .pill .big { font-size: 1.3rem; font-weight: 800 }

    /* Countdown (kept from the old screen, restyled to fit) */
    #cd-widget-wrap { margin: 0 }
    .cd-widget { background: var(--panel); border: 1px solid var(--line); border-radius: 1.2rem; padding: .5rem 1.4rem; display: flex; align-items: center; gap: 1.2rem; position: relative; overflow: hidden }
    .cd-name { font-size: .9rem; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: .12em }
    .cd-units { display: flex; align-items: center; gap: .2rem }
    .cd-unit { display: flex; flex-direction: column; align-items: center; min-width: 2.6rem }
    .cd-num { font-size: 2rem; font-weight: 800; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums }
    .cd-lbl { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); font-weight: 700 }
    .cd-sep { font-size: 1.6rem; color: var(--line); padding-bottom: .5rem }
    .cd-widget--celebrate { border-color: transparent !important; color: #fff }
    .cd-widget--celebrate .cd-name { color: rgba(255,255,255,.85) }
    .cd-celebrate-body { display: flex; align-items: baseline; gap: 1rem }
    .cd-done-msg { font-size: 1.6rem; font-weight: 800; color: #fff; animation: cd-pulse 1.4s ease-in-out infinite alternate }
    .cd-done-sub { font-size: .95rem; color: rgba(255,255,255,.8) }
    .cd-confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 9999 }
    .cd-confetti-piece { position: absolute; top: -14px; border-radius: 2px; animation: cd-fall linear forwards }
    @keyframes cd-bg-shift {
      0%   { background: linear-gradient(135deg,#1a0533 0%,#0a1a3d 50%,#001a10 100%) }
      25%  { background: linear-gradient(135deg,#1a2800 0%,#3d1500 50%,#001a3d 100%) }
      50%  { background: linear-gradient(135deg,#001a3d 0%,#1a0533 50%,#1a2800 100%) }
      75%  { background: linear-gradient(135deg,#3d1500 0%,#001a10 50%,#1a0533 100%) }
      100% { background: linear-gradient(135deg,#0a1a3d 0%,#1a2800 50%,#3d0a1a 100%) }
    }
    @keyframes cd-pulse { 0% { transform:scale(1);opacity:0.9 } 100% { transform:scale(1.07);opacity:1 } }
    @keyframes cd-fall  { 0% { transform:translateY(0) rotate(0deg);opacity:1 } 100% { transform:translateY(110vh) rotate(720deg);opacity:0 } }
  </style>
</head>
<body>
  <div id="root" class="full-center">Loading…</div>

  <script type="module">
    const fromPath = location.pathname.split('/dashboard/')[1]?.split('/')[0]
    const token = fromPath || new URLSearchParams(location.search).get('token')
    // ?debug=1 surfaces why the YouTube ticker isn't rendering. Off by default
    // so an office screen never shows diagnostics.
    const DEBUG = new URLSearchParams(location.search).has('debug')
    const REFRESH_MS = 3 * 60 * 1000

    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    const DOW   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
    const DOWF  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
    const MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']

    const parseDay  = s => s ? new Date(s + 'T00:00:00') : null
    const isoDate   = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`
    const fmtShort  = s => { const d = parseDay(s); return d ? `${d.getDate()} ${MONTH[d.getMonth()]}` : '' }
    const pad       = n => String(n).padStart(2, '0')

    const root = document.getElementById('root')

    if (!token) {
      root.innerHTML = `<div class="error-state"><h2>Invalid link</h2><p>This dashboard link is not valid.</p></div>`
      throw new Error('No token')
    }

    // ── Countdown state (module-level so tick survives re-renders) ──
    let cdTarget = null, cdName = '', cdCelebrated = false
    let confettiRunning = false

    function startConfetti() {
      if (confettiRunning) return
      confettiRunning = true
      document.getElementById('cd-confetti-layer')?.remove()
      const layer = document.createElement('div')
      layer.id = 'cd-confetti-layer'; layer.className = 'cd-confetti-layer'
      document.body.appendChild(layer)
      const COLORS = ['#f59e0b','#ef4444','#10b981','#3b82f6','#8b5cf6','#ec4899','#f97316','#06b6d4','#fbbf24','#a3e635']
      const spawn = () => {
        if (!document.contains(layer)) { clearInterval(t); confettiRunning = false; return }
        for (let i = 0; i < 8; i++) {
          const el = document.createElement('div'); el.className = 'cd-confetti-piece'
          const size = 7 + Math.random() * 10, dur = 2.5 + Math.random() * 2
          el.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size*(0.4+Math.random()*0.8)}px;background:${COLORS[Math.floor(Math.random()*COLORS.length)]};animation-duration:${dur}s`
          layer.appendChild(el); setTimeout(() => el.remove(), dur * 1000 + 100)
        }
      }
      spawn(); const t = setInterval(spawn, 220)
      setTimeout(() => { clearInterval(t); setTimeout(() => { layer.remove(); confettiRunning = false }, 3000) }, 30000)
    }

    function tickCountdown() {
      const wrap = document.getElementById('cd-widget-wrap')
      if (!wrap || cdTarget == null) return
      const diff = cdTarget - Date.now()
      const sinceEnd = Date.now() - cdTarget
      if (diff > 0) {
        const t = Math.floor(diff / 1000)
        const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v }
        set('cd-d', Math.floor(t / 86400)); set('cd-h', pad(Math.floor((t % 86400) / 3600)))
        set('cd-m', pad(Math.floor((t % 3600) / 60))); set('cd-s', pad(t % 60))
        cdCelebrated = false
      } else if (sinceEnd < 86400000) {
        if (!cdCelebrated) {
          cdCelebrated = true
          wrap.innerHTML = `<div class="cd-widget cd-widget--celebrate" style="animation:cd-bg-shift 4s ease infinite alternate">
            <div class="cd-name">${esc(cdName)}</div>
            <div class="cd-celebrate-body">
              <div class="cd-done-msg">🎉 It's a wrap! 🎉</div>
              <div class="cd-done-sub">The deadline has passed — nice work, everyone.</div>
            </div>
          </div>`
          startConfetti()
        }
      } else {
        wrap.style.display = 'none'
        cdTarget = null
      }
    }

    function clock() {
      const el = document.getElementById('dash-clock'); if (!el) return
      el.textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    }

    function dueMeta(due, today) {
      if (!due) return { cls: 'due-ok', text: '—' }
      const d = parseDay(due), t = parseDay(today)
      const days = Math.round((d - t) / 86400000)
      if (days < 0)   return { cls: 'due-overdue', text: `${Math.abs(days)}d overdue` }
      if (days === 0) return { cls: 'due-soon', text: 'Today' }
      if (days <= 3)  return { cls: 'due-soon', text: `${days}d` }
      return { cls: 'due-ok', text: fmtShort(due) }
    }

    function hexRgba(hex, a) {
      try { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})` }
      catch { return `rgba(180,140,80,${a})` }
    }

    let lastGood = null

    async function load() {
      let data
      try {
        const res = await fetch(`/api/portal?view=dashboard&token=${encodeURIComponent(token)}`)
        if (res.status === 404) { root.className='full-center'; root.innerHTML=`<div class="error-state"><h2>Not found</h2><p>This dashboard link doesn't exist.</p></div>`; return }
        if (!res.ok) throw new Error('HTTP ' + res.status)
        data = await res.json(); lastGood = data
      } catch {
        if (lastGood) { render(lastGood, true); return }
        root.className='full-center'; root.innerHTML=`<div class="error-state"><h2>Unavailable</h2><p>Could not load dashboard. Retrying…</p></div>`; return
      }
      render(data, false)
    }

    const initials = n => String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'
    const AV_COLOURS = ['#2fb67c', '#3b82e6', '#ec4e9a', '#e8890c', '#7B6EAB', '#0891b2', '#C47E3A']
    const avColour = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLOURS[h % AV_COLOURS.length] }
    const avatar = name => name
      ? `<div class="av" style="background:${avColour(name)}" title="${esc(name)}">${esc(initials(name))}</div>`
      : `<div class="av" style="background:#a89a86" title="Unassigned">?</div>`

    // How far away a deadline is, in big words for the room.
    function whenOf(i) {
      const dt = parseDay(i.date)
      const sub = `${DOW[dt.getDay()]} ${dt.getDate()} ${MONTH[dt.getMonth()]}`
      if (i.days < 0) return { cls: 'over', big: i.days === -1 ? '1 day' : `${-i.days} days`, small: `OVERDUE · ${sub}` }
      if (i.days === 0) return { cls: 'today', big: 'TODAY', small: i.due_label || sub }
      if (i.days === 1) return { cls: 'later', big: 'Tomorrow', small: sub }
      if (i.days <= 7) return { cls: 'later', big: DOWF[dt.getDay()].slice(0, 3), small: `in ${i.days} days` }
      return { cls: 'later', big: `${dt.getDate()} ${MONTH[dt.getMonth()]}`, small: `in ${i.days} days` }
    }

    function deadlineRow(i) {
      const w = whenOf(i)
      return `<div class="d ${w.cls}">
        <div class="when">${esc(w.big)}<small>${esc(w.small)}</small></div>
        <div><div class="what">${esc(i.title)}</div><div class="who">${esc([i.type_label, i.context].filter(Boolean).join(' · '))}</div></div>
        ${avatar(i.owner)}
      </div>`
    }

    function render(d, stale) {
      const today = d.today

      // ── Timers ─────────────────────────────────────────────────────
      const tm = d.timers || {}
      // Reset cd state on fresh data load (not stale)
      if (!stale && tm.countdown) {
        const tgt = new Date(tm.countdown.target)
        if (!isNaN(tgt.getTime())) { cdTarget = tgt.getTime(); cdName = tm.countdown.name; cdCelebrated = false }
      } else if (!stale && !tm.countdown) {
        cdTarget = null
      }

      let dsHTML = ''
      if (tm.daysSince) {
        const since = parseDay(tm.daysSince.since)
        if (since) {
          const days = Math.floor((parseDay(today).getTime() - since.getTime()) / 86400000)
          dsHTML = `<span class="pill ds"><span class="big">${days}</span> days since ${esc(tm.daysSince.name)}</span>`
        }
      }
      let ytHTML = ''
      if (tm.youtube && Number.isFinite(tm.youtube.views)) {
        ytHTML = `<span class="pill yt"><span class="big">${tm.youtube.views.toLocaleString('en-GB')}</span> ${esc(tm.youtube.label)}</span>`
      } else if (DEBUG && tm.youtubeError) {
        ytHTML = `<span style="color:var(--amber)">YouTube ticker: ${esc(tm.youtubeError)}</span>`
      }
      let cdHTML = ''
      if (cdTarget != null && (cdTarget - Date.now()) > -86400000) {
        const diff = cdTarget - Date.now()
        const t = diff > 0 ? Math.floor(diff / 1000) : 0
        cdHTML = diff > 0
          ? `<div id="cd-widget-wrap"><div class="cd-widget">
              <div class="cd-name">${esc(cdName)}</div>
              <div class="cd-units">
                <div class="cd-unit"><div class="cd-num" id="cd-d">${Math.floor(t/86400)}</div><div class="cd-lbl">days</div></div><div class="cd-sep">:</div>
                <div class="cd-unit"><div class="cd-num" id="cd-h">${pad(Math.floor((t%86400)/3600))}</div><div class="cd-lbl">hrs</div></div><div class="cd-sep">:</div>
                <div class="cd-unit"><div class="cd-num" id="cd-m">${pad(Math.floor((t%3600)/60))}</div><div class="cd-lbl">min</div></div><div class="cd-sep">:</div>
                <div class="cd-unit"><div class="cd-num" id="cd-s">${pad(t%60)}</div><div class="cd-lbl">sec</div></div>
              </div></div></div>`
          : `<div id="cd-widget-wrap"></div>`
      }

      // ── Deadlines: overdue, today, then what's coming ──────────────
      const items = d.deadlines || []
      const over = items.filter(i => i.days < 0), now = items.filter(i => i.days === 0)
      const soon = items.filter(i => i.days > 0 && i.days <= 7), later = items.filter(i => i.days > 7)
      const LIMIT = 9   // what fits on a 1080p screen; the rest becomes "+ n more"
      let room = LIMIT
      const block = (title, list) => {
        if (!list.length || room <= 0) return ''
        const shown = list.slice(0, room); room -= shown.length
        const rest = list.length - shown.length
        return `${title ? `<div class="grp">${title}</div>` : ''}${shown.map(deadlineRow).join('')}${rest ? `<div class="more">+ ${rest} more</div>` : ''}`
      }
      const dlHTML = items.length
        ? block('Overdue', over) + block('Today', now) + block('Next 7 days', soon) + block('Later', later)
        : `<div class="empty">Nothing due in the next two weeks. 🎉</div>`

      // ── Week strip (Mon–Sun) ───────────────────────────────────────
      const start = parseDay(d.range.start)
      const holByDay = {}
      for (const h of (d.holidays || [])) holByDay[h.date] = h.name
      const week = []
      for (let i = 0; i < 7; i++) {
        const dt = new Date(start); dt.setDate(dt.getDate() + i)
        const ds = isoDate(dt)
        const evs = (d.calendar || []).filter(e => e.start <= ds && e.end >= ds)
        const shown = evs.slice(0, 4)
        week.push(`<div class="wd${ds === today ? ' t' : ''}${dt.getDay() % 6 === 0 ? ' we' : ''}">
          <b>${DOW[dt.getDay()].toUpperCase()}</b><div class="dt">${dt.getDate()}</div>
          ${holByDay[ds] ? `<div class="hol">${esc(holByDay[ds])}</div>` : ''}
          ${shown.map(e => `<div class="ev${e.isDeadline ? ' dl' : ''}" style="background:${esc(e.color)}">${esc(e.label)}${e.assignee ? ' · ' + esc(initials(e.assignee)) : ''}</div>`).join('')}
          ${evs.length > shown.length ? `<div class="more">+ ${evs.length - shown.length}</div>` : ''}
        </div>`)
      }

      // ── Retainers ──────────────────────────────────────────────────
      const rets = (d.retainers || []).filter(r => r.allocation != null && r.allocation > 0).slice(0, 5)
      const retHTML = rets.length ? rets.map(r => {
        const over = r.pct > 100, warn = r.pct >= r.alert
        const col = over ? 'var(--red)' : warn ? 'var(--amber)' : 'var(--green)'
        return `<div class="ret-row"><div class="top"><span>${esc(r.name)}</span><span>${r.pct}% · ${r.used}/${r.allocation}h</span></div>
          <div class="bar"><i style="width:${Math.min(100, r.pct)}%;background:${col}"></i></div></div>`
      }).join('') : ''

      root.className = ''; root.style = ''
      root.innerHTML = `
        <div class="screen">
          <header class="hdr">
            <div class="hdr-co">${esc(d.company)}<b>.</b></div>
            <div class="hdr-right">
              ${stale ? '<span class="hdr-stale">⚠ reconnecting…</span>' : ''}
              <span class="hdr-date">${parseDay(today).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</span>
              <span class="hdr-clock" id="dash-clock">--:--</span>
            </div>
          </header>
          <div class="main">
            <div class="col"><section class="panel grow"><h2>Deadlines <span class="n">${items.length}</span></h2><div class="dl">${dlHTML}</div></section></div>
            <div class="col">
              <section class="panel grow"><h2>This week</h2><div class="week">${week.join('')}</div></section>
              ${retHTML ? `<section class="panel"><h2>Retainers</h2><div class="ret">${retHTML}</div></section>` : ''}
            </div>
          </div>
          <footer class="foot">${cdHTML}${dsHTML}${ytHTML}<span class="live">${stale ? 'offline, showing the last update' : 'Live · updated ' + new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span></footer>
        </div>`

      clock()
      tickCountdown()
    }

    load()
    setInterval(load, REFRESH_MS)
    setInterval(clock, 15000)
    setInterval(tickCountdown, 1000)
  </script>
</body>
</html>
