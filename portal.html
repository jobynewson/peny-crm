<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Client portal</title>
  <!-- The same theme choice as Slate (see index.html); with none saved the
       portal follows the device. -->
  <script>
    try {
      var t = localStorage.getItem('slate-theme')
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
  </script>
</head>
<body>
  <div id="portal"><div class="pt-center">Loading…</div></div>
  <script type="module" src="/src/portal/main.js"></script>
</body>
</html>
