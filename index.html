<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slate</title>
  <!-- Apply a forced theme before the stylesheet paints, so there's no flash of
       the wrong one. 'light' / 'dark' force Warm Paper / Darkroom; anything else
       (System, or nothing saved) leaves the attribute off and tokens.css
       follows the device setting. -->
  <script>
    try {
      var t = localStorage.getItem('slate-theme')
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- Auth screen — shown when not signed in -->
  <div id="auth">
    <div id="auth-inner">
      <div id="auth-brand">
        <img src="/slate-logo.png" alt="Slate" id="auth-logo" />
        <div id="auth-product">Slate</div>
      </div>
      <div id="sign-in"></div>
    </div>
  </div>

  <!-- Main app — shown when signed in -->
  <div id="app" style="display:none"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
